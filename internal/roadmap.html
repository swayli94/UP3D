.arrow { flex: 0 0 26px; align-self: center; height: 2px; background: var(--border); position: relative; margin: 0 2px; }
.arrow::after { content: ""; position: absolute; right: -1px; top: -4px; border: 5px solid transparent; border-left: 7px solid var(--border); border-right: 0; }

<script>
(function () {

  function $(id) { return document.getElementById(id); }

  var TEXT = JSON.parse($("roadmap-strings").textContent);

    var args = arguments;
    return TEXT[key].replace(/\{(\d+)\}/g, function (_, i) { return args[+i + 1]; });
  }

  // Displayed statuses are derived by devflow; css maps them onto the shared colour classes.
  var STATUS = {};
  [["done", "done"], ["archived", "done"], ["merged", "done"], ["active", "active"], ["ready", "next"],
   ["planned", "planned"], ["draft", "draft"], ["deferred", "deferred"]].forEach(function (pair) {
    STATUS[pair[0]] = { label: t("status." + pair[0]), css: pair[1] };
  });
  var COMPLETE = { done: true, archived: true, merged: true };
  var KIND = {};
  ["proposal", "discussion", "followup", "decision"].forEach(function (kind) { KIND[kind] = t("kind." + kind); });
  var SEP = t("separator");
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // Escape, then render `code` spans.
  function fmt(s) { return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }
  function css(st) { return (STATUS[st] || { css: st }).css; }
  function pill(st) { return '<span class="pill s-' + esc(css(st)) + '">' + esc((STATUS[st] || { label: st }).label) + "</span>"; }

  var data = JSON.parse($("roadmap-data").textContent);
  var live = data.live;
  // Links are written relative to internal/; the live page lives in runs/views/
  // A relative prefix keeps every link a path, never a URL scheme
  var BASE = live ? "../../internal/" : "./";
  // Keyed by project ids: without a prototype, an id or URL hash such as "constructor" is no item
  var items = Object.create(null), order = [], dependents = Object.create(null), changes = Object.create(null);
  (data.changes || []).forEach(function (c) { changes[c.id] = c; });
  if (live) {
    (live.merged || []).forEach(function (id) { if (changes[id]) changes[id].merged = true; });
  }

  // Case stages are the workflow steps of any phase, as plan validation reads them
  var caseStepById = {};
  (data.phases || []).forEach(function (ph) {
    ((ph.workflow || {}).steps || []).forEach(function (step) { caseStepById[step.id] = step; });
  });
  function caseStage(id) {
    var step = caseStepById[id];
    return step ? step.code + " " + step.title : id || "—";
  }

  // ---- index ----
  (data.phases || []).forEach(function (ph) {
    (ph.lanes || []).forEach(function (ln) {
      (ln.items || []).forEach(function (it) {
        it._phase = ph; it._lane = ln;
        // Merged is a fact of Git, shown only in the live view
        if (live && it.status === "archived" && (it.changes || []).every(function (id) { return changes[id] && changes[id].merged; })) {
          it.status = "merged";
        }
        items[it.id] = it; order.push(it.id);
      });
    });
  });
  order.forEach(function (id) {
    (items[id].deps || []).forEach(function (d) { (dependents[d] = dependents[d] || []).push(id); });
  });

  // ---- header ----
  var all = order.map(function (id) { return items[id]; });
  function count(st) { return all.filter(function (it) { return it.status === st; }).length; }
  var nComplete = all.filter(function (it) { return COMPLETE[it.status]; }).length;
  $("subtitle").innerHTML = t(live ? "subtitle.live" : "subtitle.committed") + t("subtitle.rest", esc(data.updated || "—"));
  $("stats").innerHTML = [
    [t("stat.version"), data.version || "—"],
    [t("stat.complete"), nComplete + " / " + all.length],
    [t("stat.active"), String(count("active"))],
    [t("stat.ready"), String(count("ready"))]
  ].map(function (kv) {
    return '<div class="stat"><div class="k">' + esc(kv[0]) + '</div><div class="v">' + esc(kv[1]) + "</div></div>";
  }).join("");

  // ---- global development map ----
  function renderGlobalMap(map) {
    if (!map) { $("globalMap").innerHTML = ""; return; }
    var vb = map.viewBox || [0, 0, 1200, 660];
    var edges = (map.edges || []).map(function (e) {
      var dashed = e.kind === "dashed";

        '" marker-end="url(#map-arrow' + (dashed ? "-muted" : "") + ')" />' +
        (e.label ? '<text class="map-label" x="' + esc(e.x) + '" y="' + esc(e.y) + '">' + esc(e.label) + "</text>" : "");
    }).join("");
    var nodes = (map.nodes || []).map(function (n) {
      var body = '<rect x="' + esc(n.x) + '" y="' + esc(n.y) + '" width="' + esc(n.w) + '" height="' + esc(n.h) + '" rx="9" />' +
        '<text class="map-title" x="' + esc(n.x + 14) + '" y="' + esc(n.y + 24) + '">' + esc(n.title) + "</text>" +
        (n.lines || []).map(function (line, i) {
          return '<text class="map-line" x="' + esc(n.x + 14) + '" y="' + esc(n.y + 45 + i * 18) + '">' + esc(line) + "</text>";
        }).join("");
      return '<g class="map-node ' + esc(n.style || "") + '">' +
        (n.link ? '<a href="#' + esc(n.link) + '" aria-label="' + t("map.jump", esc(n.title)) + '">' + body + "</a>" : body) + "</g>";
    }).join("");
    $("globalMap").innerHTML = '<section class="panel global-panel" aria-labelledby="globalMapHeading">' +
      '<h2 id="globalMapHeading">' + esc(map.title) + "</h2>" +
      '<p class="global-note">' + esc(map.note || "") + "</p>" +
      '<div class="map-scroll"><svg class="global-svg" viewBox="' + esc(vb.join(" ")) + '" role="img" aria-labelledby="globalMapSvgTitle">' +
      '<title id="globalMapSvgTitle">' + esc(map.title) + "</title><defs>" +
      '<marker id="map-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)" /></marker>' +
      '<marker id="map-arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--muted)" /></marker>' +
      "</defs>" + edges + nodes + "</svg></div>" +
      ((map.legend || []).length ? '<ul class="map-legend">' + map.legend.map(function (entry) { return "<li>" + fmt(entry) + "</li>"; }).join("") + "</ul>" : "") +
      "</section>";
  }
  renderGlobalMap(data.globalMap);

  // ---- parallel development plan (references, never duplicate task status) ----
  function waiting(it) {
    return (it.deps || []).filter(function (id) { return items[id] && !COMPLETE[items[id].status]; });
  }
  function changeLabel(id) {
    var c = changes[id];

    return id + (tasks ? t("change.tasks", tasks.complete, tasks.total) : "") + (c && c.merged ? t("change.merged") : "");
  }
  function parallelTask(it) {
    var state = "", ready = it.status === "ready";
    if (it.status === "active") {
      state = (it.changes || []).filter(function (id) { return changes[id] && !changes[id].archived; }).map(changeLabel).join(SEP);
    } else if (it.status === "ready") {

    } else if (it.status === "planned") {
      state = t("state.waiting", waiting(it).map(function (id) { return items[id].code || id; }).join(SEP));

    return '<button type="button" class="parallel-task s-' + esc(css(it.status)) + '" data-open="' + esc(it.id) + '">' +
      '<span class="parallel-task-top"><span class="parallel-task-code">' + esc(it.code || "") + "</span>" + pill(it.status) + "</span>" +
      '<span class="parallel-task-title">' + fmt(it.title) + "</span>" +

  function parallelGroup(label, list) {
    if (!list.length) return "";
    return '<div class="parallel-group"><div class="parallel-group-title">' + t("count", esc(label), list.length) + "</div>" +

    return '<button type="button" class="rel" data-open="' + esc(id) + '">' + esc(it.code ? it.code + " " : "") + fmt(it.title) + "</button> " + pill(it.status);
  }
  function renderParallelPlan(plan) {
    if (!plan) { $("parallel-development").innerHTML = ""; return; }
    var lanes = (plan.lanes || []).map(function (lane) {
      var laneItems = (lane.items || []).map(function (id) { return items[id]; }).filter(Boolean);
      var done = laneItems.filter(function (it) { return COMPLETE[it.status]; });
      var current = laneItems.filter(function (it) { return it.status === "active"; });
      var upcoming = laneItems.filter(function (it) { return done.indexOf(it) < 0 && current.indexOf(it) < 0; });
      var ready = upcoming.filter(function (it) { return it.status === "ready"; }).length;
      return '<article class="parallel-lane"><div class="parallel-lane-head"><span class="parallel-lane-code">' + esc(lane.code) + "</span>" +
        '<h3>' + fmt(lane.title) + '</h3><span class="parallel-machine">' + esc(lane.machine || "") + "</span></div>" +
        '<p class="parallel-role">' + fmt(lane.role || "") + "</p>" +
        '<div class="parallel-lane-stats">' + t("lane.stats", done.length, laneItems.length, current.length, ready) + "</div>" +
        parallelGroup(t("group.done"), done) + parallelGroup(t("group.current"), current) + parallelGroup(t("group.upcoming"), upcoming) + "</article>";
    }).join("");
    var gates = (plan.gates || []).map(function (gate) {
      var targets = (gate.targets || []).filter(function (id) { return items[id]; });
      var done = targets.filter(function (id) { return COMPLETE[items[id].status]; }).length;
      return '<article class="parallel-gate"><div class="parallel-gate-head"><h3>' + esc(gate.code) + " · " + fmt(gate.title) + '</h3>' +
        '<span class="parallel-gate-count">' + t("gate.count", done, targets.length) + "</span></div>" +
        '<p>' + fmt(gate.text || "") + '</p><div class="parallel-gate-targets">' +
        targets.map(function (id) { return "<div>" + relLink(id) + "</div>"; }).join("") + "</div></article>";
    }).join("");
    // Optional project notes beside the rules, such as an integration checklist
    var notes = plan.notes;
    $("parallel-development").innerHTML = '<div class="parallel-head"><h2 id="parallelHeading">' + fmt(plan.title) + "</h2></div>" +
      '<p class="parallel-note">' + fmt(plan.note || "") + "</p>" +
      '<div class="parallel-lanes">' + lanes + '</div><div class="parallel-gates">' + gates + "</div>" +
      '<div class="parallel-bottom"><section class="parallel-rules"><h3>' + t("parallel.rules") + "</h3><ul>" +
      (plan.rules || []).map(function (rule) { return "<li>" + fmt(rule) + "</li>"; }).join("") + "</ul></section>" +
      (notes ? '<section class="parallel-windows"><h3>' + fmt(notes.title || "") + '</h3><p>' + fmt(notes.summary || "") + "</p><ul>" +
        (notes.items || []).map(function (entry) { return "<li>" + fmt(entry) + "</li>"; }).join("") + "</ul></section>" : "") + "</div>";
  }
  renderParallelPlan(data.parallelPlan);

  // ---- now panel: active Changes and ready items, derived rather than written by hand ----
  function list(arr, f) { return "<ul>" + arr.map(function (x) { return "<li>" + f(x) + "</li>"; }).join("") + "</ul>"; }
  function changeLink(id) {
    var c = changes[id];
    return '<a href="' + BASE + '../openspec/changes/' + esc(c.path) + '/proposal.md"><code>' + esc(changeLabel(id)) + "</code></a>";
  }
  var activeChanges = (data.now.active || []).filter(function (id) { return changes[id]; });
  var readyItems = (data.now.ready || []).filter(function (id) { return items[id]; });
  var openQ = all.filter(function (it) { return (it.decisions || []).length && (it.status === "active" || it.status === "ready"); });
  var laterQ = all.filter(function (it) { return (it.decisions || []).length && openQ.indexOf(it) < 0 && !COMPLETE[it.status]; });
  function qBlock(arr) {
    return arr.map(function (it) {
      return '<div class="qgroup"><div class="qh"><button type="button" data-open="' + esc(it.id) + '">' +
        esc(it.code ? it.code + " " : "") + fmt(it.title) + "</button></div><ul>" +
        it.decisions.map(function (q) { return "<li>" + q + "</li>"; }).join("") + "</ul></div>";
    }).join("");
  }
  $("now").innerHTML =
    '<div class="panel"><h2>' + t("now.position") + "</h2>" +
      (activeChanges.length ? list(activeChanges, function (id) {
        var c = changes[id];
        return changeLink(id) + (c.item ? " · " + relLink(c.item) : t("now.unlinked"));
      }) : '<p class="qwhen">' + t("now.noActive") + "</p>") +
      "<h2>" + t("now.ready", readyItems.length) + "</h2>" +
      (readyItems.length ? list(readyItems, relLink) : '<p class="qwhen">' + t("now.noReady") + "</p>") +
    "</div>" +
    '<div class="panel"><h2>' + t("questions.title") + "</h2>" +
      (openQ.length ? qBlock(openQ) : '<p class="qwhen">' + t("questions.none") + "</p>") +
      (laterQ.length ? '<details style="margin-top:10px"><summary>' + t("questions.later", laterQ.reduce(function (n, it) { return n + it.decisions.length; }, 0)) + "</summary>" + qBlock(laterQ) + "</details>" : "") +
    "</div>";

  // ---- legend ----
  $("legend").innerHTML = Object.keys(STATUS).filter(function (st) { return live || st !== "merged"; }).map(pill).join("");

  // ---- local state (live view only) ----
  if (live) {
    var wt = live.worktrees || [], locks = live.locks || [];
    $("local").innerHTML = '<div class="phase-head"><h2>' + t("local.title") + '</h2><span class="progress">' + t("local.integration", "<code>" + esc(live.integrationBranch) + "</code>") + "</span></div>" +
      '<div class="panel tbl-wrap"><table class="tbl"><thead><tr><th>worktree</th><th>' + t("local.branch") + "</th><th>" + t("local.commit") + "</th><th>" + t("local.held") + "</th></tr></thead><tbody>" +
      wt.map(function (w) {
        var held = Object.keys(w.changes || {}).sort().map(function (id) { return t("local.heldItem", esc(id), w.changes[id].complete, w.changes[id].total); }).join(SEP);
        return "<tr><td><code>" + esc(w.path) + "</code></td><td>" + esc(w.branch || "detached") + "</td><td><code>" + esc(w.commit || "") + "</code></td><td>" + (w.error ? t("local.unreadable", esc(w.error)) : held || "—") + "</td></tr>";
      }).join("") +
      "</tbody></table></div>" +
      '<div class="panel tbl-wrap" style="margin-top:10px"><table class="tbl"><thead><tr><th>' + t("local.lock") + "</th><th>Change</th><th>Run</th></tr></thead><tbody>" +
      (locks.length ? locks.map(function (l) {
        return "<tr><td>" + esc(l.resource || l.name || "") + "</td><td>" + esc(l.change || "") + "</td><td><code>" + esc(l.run || l.runId || "") + "</code></td></tr>";
      }).join("") : '<tr><td colspan="3">' + t("local.noLocks") + "</td></tr>") + "</tbody></table></div>";
  }

  // ---- phases ----
  function node(it) {
    var b = [];
    if ((it.decisions || []).length && !COMPLETE[it.status]) b.push('<span class="badge q">' + t("badge.questions", it.decisions.length) + "</span>");
    if (it.case) b.push('<span class="badge case-stage" title="' + t("badge.caseStage") + '">' + esc(caseStage(it.case.current)) + "</span>");
    if (it.kind && it.kind !== "proposal") b.push('<span class="badge">' + esc(KIND[it.kind] || it.kind) + "</span>");
    var meta = it.status === "active"
      ? (it.changes || []).filter(function (id) { return changes[id] && !changes[id].archived; }).map(changeLabel).join(SEP)
      : (it.end || "");
    return '<button type="button" class="node s-' + esc(css(it.status)) + '" data-id="' + esc(it.id) + '" aria-label="' + esc(t("node.label", (it.code || "") + " " + it.title.replace(/`/g, ""), (STATUS[it.status] || {}).label)) + '">' +
      '<span class="node-top"><span class="node-code">' + esc(it.code || "") + "</span>" + pill(it.status) + "</span>" +
      '<span class="node-title">' + fmt(it.title) + "</span>" +
      (meta ? '<span class="node-meta">' + esc(meta) + "</span>" : "") +
      (b.length ? '<span class="node-badges">' + b.join("") + "</span>" : "") +
      "</button>";
  }
  function renderWorkflow(ph) {
    var w = ph.workflow;
    if (!w) return "";
    var steps = (w.steps || []).map(function (step, i) {
      return (i ? '<span class="arrow" aria-hidden="true"></span>' : "") +
        '<div class="process-node"><div class="process-code">' + esc(step.code) + "</div>" +
        '<div class="process-title">' + fmt(step.title) + "</div>" +
        "<p>" + t("workflow.input", fmt(step.input)) + "</p><p>" + t("workflow.output", fmt(step.output)) + "</p></div>";
    }).join("");
    var branches = (w.branches || []).map(function (branch) {
      return '<div class="case-branch"><div class="branch-input">' + fmt(branch.input) + '</div><div class="branch-handling">' + fmt(branch.handling) + "</div></div>";
    }).join("");
    return '<div class="lane workflow"><div class="lane-head"><h3>' + fmt(w.title) + "</h3>" +
      (w.note ? '<span class="ln">' + fmt(w.note) + "</span>" : "") + '</div><div class="flow workflow-flow">' + steps + "</div>" +
      (branches ? '<div class="case-branches">' + branches + "</div>" : "") +
      (w.feedback ? '<p class="workflow-feedback">' + fmt(w.feedback) + "</p>" : "") + "</div>";
  }
  $("phases").innerHTML = (data.phases || []).map(function (ph) {
    var its = [];
    (ph.lanes || []).forEach(function (ln) { its = its.concat(ln.items || []); });
    var done = its.filter(function (it) { return COMPLETE[it.status]; }).length;
    var pct = its.length ? Math.round(100 * done / its.length) : 0;
    return '<section class="phase" id="phase-' + esc(ph.id) + '">' +
      '<div class="phase-head"><h2>' + fmt(ph.title) + "</h2>" +
        '<span class="progress"><span class="bar"><i style="width:' + pct + '%"></i></span>' + done + " / " + its.length + "</span></div>" +
      (ph.note ? '<p class="phase-note">' + fmt(ph.note) + "</p>" : "") + renderWorkflow(ph) +
      (ph.lanes || []).map(function (ln) {
        var seq = ln.flow !== "parallel";
        var lane = ln.items || [];
        var inner = lane.map(function (it, i) {
          var arrow = "";
          if (seq && i > 0) arrow = '<span class="arrow' + (COMPLETE[lane[i - 1].status] ? " lit" : "") + '" aria-hidden="true"></span>';
          return arrow + node(it);
        }).join("");
        return '<div class="lane"><div class="lane-head"><h3>' + fmt(ln.title) + "</h3>" +
          (ln.note ? '<span class="ln">' + fmt(ln.note) + "</span>" : "") + "</div>" +
          '<div class="flow' + (seq ? "" : " parallel") + '">' + inner + "</div></div>";
      }).join("") +
      "</section>";
  }).join("");

  // ---- Changes ----
  function conclusion(c) {
    if (!c.archived) {
      var tasks = live && live.tasks && live.tasks[c.id];
      return t("conclusion.active") + (tasks ? t("conclusion.tasks", tasks.complete, tasks.total) : "");
    }
    var r = c.conclusion || {};
    var verified = t(r.verified === true ? "conclusion.verified" : r.verified === false ? "conclusion.failed" : "conclusion.unknown");
    var source = r.source === "acceptance" ? t("conclusion.acceptance", esc(r.profile || "")) : t("conclusion.noSnapshot");
    return verified + " · " + t(r.approved ? "conclusion.approved" : "conclusion.notApproved") + " · " + source +
      (live ? (c.merged ? t("conclusion.merged") : t("conclusion.notMerged", esc(live.integrationBranch))) : "");
  }
  $("changes").innerHTML = '<div class="phase-head"><h2>Changes</h2><span class="progress">' + t("changes.count", (data.changes || []).length) + "</span></div>" +
    '<p class="phase-note">' + t("changes.note") + "</p>" +
    '<div class="panel tbl-wrap"><table class="tbl"><thead><tr><th>Change</th><th>' + t("changes.item") + "</th><th>" + t("changes.branch") + "</th><th>" + t("changes.conclusion") + "</th></tr></thead><tbody>" +
    (data.changes || []).map(function (c) {
      return "<tr><td>" + changeLink(c.id) + "</td><td>" + (c.item ? relLink(c.item) : "—") + "</td><td><code>" + esc(c.branch || "") +
        "</code></td><td>" + conclusion(c) + "</td></tr>";
    }).join("") + "</tbody></table></div>";

  // ---- deferred and unscheduled index (generated, no duplicate source items) ----
  var backlogGroups = ["post-mvp", "unscheduled"].map(function (id) { return { id: id, title: t("backlog." + id) }; });
  var backlogCount = all.filter(function (it) { return it.status === "deferred"; }).length;
  $("backlog").innerHTML = '<div class="phase-head"><h2>' + t("backlog.title") + '</h2><span class="progress">' + t("backlog.count", backlogCount) + "</span></div>" +
    '<p class="phase-note">' + t("backlog.note") + "</p>" +
    backlogGroups.map(function (group) {
      var rows = all.filter(function (it) { return it.status === "deferred" && it.backlog === group.id; });
      if (!rows.length) return "";
      return '<div class="panel tbl-wrap backlog-group"><h3>' + esc(group.title) + "</h3>" +
        '<table class="tbl"><thead><tr><th>' + t("backlog.item") + "</th><th>" + t("backlog.lane") + "</th><th>" + t("backlog.deps") + "</th><th>" + t("backlog.questions") + "</th></tr></thead><tbody>" +
        rows.map(function (it) {
          var deps = (it.deps || []).filter(function (id) { return items[id]; });
          return "<tr><td>" + relLink(it.id) + "</td><td>" + fmt(it._phase.title) + '<br><span class="qwhen">' + fmt(it._lane.title) + "</span></td>" +
            "<td>" + (deps.length ? deps.map(relLink).join("<br>") : "—") + "</td><td>" + ((it.decisions || []).length ? it.decisions.join("<br>") : "—") + "</td></tr>";
        }).join("") + "</tbody></table></div>";
    }).join("");

  $("foot").innerHTML = t("foot", esc(data.formatVersion), live ? t("foot.live") : "");

  // ---- drawer ----
  var drawer = $("drawer"), scrim = $("scrim"), lastFocus = null, current = null;
  function clearRel() {
    Array.prototype.forEach.call(document.querySelectorAll(".node.selected, .node.rel-dep, .node.rel-sub"), function (n) {
      n.classList.remove("selected", "rel-dep", "rel-sub");
    });
  }
  // Compared as text, so an id with quotes or backslashes cannot break a selector
  function nodeFor(id) {
    var found = null;
    Array.prototype.forEach.call(document.querySelectorAll(".node"), function (n) {
      if (!found && n.getAttribute("data-id") === id) found = n;
    });
    return found;
  }
  function markRel(id) {
    clearRel();
    var sel = nodeFor(id);
    if (sel) sel.classList.add("selected");
    (items[id].deps || []).forEach(function (d) {
      var n = nodeFor(d); if (n) n.classList.add("rel-dep");
    });
    (dependents[id] || []).forEach(function (d) {
      var n = nodeFor(d); if (n) n.classList.add("rel-sub");
    });
  }
  function hashId() {
    try { return decodeURIComponent(location.hash.slice(1)); } catch (e) { return ""; }
  }
  function open(id, fromHash) {
    var it = items[id];
    if (!it) return;
    if (!drawer.classList.contains("open")) lastFocus = document.activeElement;
    current = id;
    $("dCode").textContent = [it.code, it._phase.title.replace(/`/g, ""), it._lane.title.replace(/`/g, "")].filter(Boolean).join(" · ");
    $("dTitle").innerHTML = fmt(it.title);
    var meta = [
      [t("drawer.status"), pill(it.status) + (it.stored !== it.status ? ' <span class="qwhen">' + t("drawer.stored", esc(it.stored)) + "</span>" : "")],
      [t("drawer.kind"), esc(KIND[it.kind] || it.kind || "—")]
    ];
    if ((it.changes || []).length) meta.push(["Change", it.changes.map(changeLink).join("<br>")]);
    if (it.start) meta.push([t("drawer.start"), esc(it.start)]);
    if (it.end) meta.push([t("drawer.end"), esc(it.end)]);
    var s = "";
    if (it.summary) s += "<section><p>" + fmt(it.summary) + "</p></section>";
    s += '<section><dl class="meta">' + meta.map(function (m) { return "<dt>" + m[0] + "</dt><dd>" + m[1] + "</dd>"; }).join("") + "</dl></section>";
    if (it.case) {
      s += "<section><h3>" + t("drawer.case") + '</h3><dl class="meta"><dt>' + t("drawer.role") + "</dt><dd>" + fmt(it.case.role || "—") + "</dd>" +
        "<dt>" + t("drawer.current") + "</dt><dd>" + esc(caseStage(it.case.current)) + "</dd><dt>" + t("drawer.target") + "</dt><dd>" + esc(caseStage(it.case.target)) + "</dd></dl></section>";
    }
    if (it.briefHtml) {
      s += '<section class="brief">' + it.briefHtml + '<p class="qwhen">' + t("drawer.source", '<a href="' + BASE + "../openspec/plan/" + esc(it.brief) + '"><code>openspec/plan/' + esc(it.brief) + "</code></a>") + "</p></section>";
    }
    var deps = (it.deps || []).filter(function (d) { return items[d]; });
    if (deps.length) s += "<section><h3>" + t("drawer.deps") + "</h3>" + list(deps, relLink) + "</section>";
    if ((dependents[id] || []).length) s += "<section><h3>" + t("drawer.dependents") + "</h3>" + list(dependents[id], relLink) + "</section>";
    if ((it.docs || []).length) s += "<section><h3>" + t("drawer.docs") + "</h3>" + list(it.docs, function (d) {
      return '<a href="' + BASE + esc(d.path) + '">' + esc(d.label) + '</a> <code>' + esc(d.path) + "</code>";
    }) + "</section>";
    $("dBody").innerHTML = s;
    $("dBody").scrollTop = 0;
    drawer.classList.add("open"); scrim.classList.add("open");
    drawer.setAttribute("aria-hidden", "false");
    markRel(id);
    if (!fromHash && location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
    $("dClose").focus({ preventScroll: true });
  }
  function close() {
    drawer.classList.remove("open"); scrim.classList.remove("open");
    drawer.setAttribute("aria-hidden", "true");
    clearRel(); current = null;
    if (location.hash) history.replaceState(null, "", location.pathname + location.search);
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-open], .node[data-id]");
    if (!t) return;
    open(t.getAttribute("data-open") || t.getAttribute("data-id"));
  });
  $("dClose").addEventListener("click", close);
  scrim.addEventListener("click", close);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && current) close(); });
  window.addEventListener("hashchange", function () {
    var id = hashId();
    if (items[id]) open(id, true);
  });

  $("dimLabel").textContent = t("dimDone");
  $("dClose").setAttribute("aria-label", t("close"));

  // Viewer preference only; never project state
  var dim = $("dimDone");
  try { dim.checked = localStorage.getItem("devflow-roadmap-dim") === "1"; } catch (e) { /* storage unavailable */ }
  document.body.classList.toggle("dim-done", dim.checked);
  dim.addEventListener("change", function () {
    document.body.classList.toggle("dim-done", dim.checked);
    try { localStorage.setItem("devflow-roadmap-dim", dim.checked ? "1" : "0"); } catch (e) { /* storage unavailable */ }
  });

  var initial = hashId();
  if (items[initial]) open(initial, true);
})();
</script>
</body>
</html>
