[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfp3d"
version = "0.1.0"
description = "Minimal tetrahedron free-stream preservation API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["pyfp3d*"]

[tool.pytest.ini_options]
testpaths = ["tests/api", "tests/e2e"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
